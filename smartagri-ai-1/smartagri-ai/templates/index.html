<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartAgri AI — Choose your language</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="lang-gate">
    <div class="lang-gate-card">
      <div class="lang-gate-mark">🌾</div>
      <h1>SmartAgri AI</h1>
      <p class="lang-gate-sub" data-i18n="choose_language_sub">Select a language to continue</p>

      <div class="lang-options" id="langOptions">
        <button type="button" class="lang-option" data-lang="en">
          <span class="lang-native">English</span>
          <span class="lang-en">English</span>
        </button>
        <button type="button" class="lang-option" data-lang="te">
          <span class="lang-native">తెలుగు</span>
          <span class="lang-en">Telugu</span>
        </button>
        <button type="button" class="lang-option" data-lang="ta">
          <span class="lang-native">தமிழ்</span>
          <span class="lang-en">Tamil</span>
        </button>
        <button type="button" class="lang-option" data-lang="hi">
          <span class="lang-native">हिन्दी</span>
          <span class="lang-en">Hindi</span>
        </button>
      </div>

      <button type="button" id="continueBtn" class="btn btn-forest" disabled data-i18n="continue">Continue</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script>
    let chosen = smartagriGetLang() || null;
    const options = document.querySelectorAll('.lang-option');
    const continueBtn = document.getElementById('continueBtn');

    function markSelected(lang) {
      options.forEach(o => o.classList.toggle('selected', o.dataset.lang === lang));
      continueBtn.disabled = false;
    }

    if (chosen) markSelected(chosen);

    options.forEach(opt => {
      opt.addEventListener('click', () => {
        chosen = opt.dataset.lang;
        smartagriSetLang(chosen);
        smartagriApplyTranslations();
        markSelected(chosen);
      });
    });

    continueBtn.addEventListener('click', () => {
      if (!chosen) return;
      window.location.href = "{{ url_for('dashboard') }}";
    });
  </script>
</body>
</html>
